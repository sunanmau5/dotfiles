[settings]
# use uv for venv management when uv.lock is present
python.uv_venv_auto = true
# auto-trust mise.toml in these directories
trusted_config_paths = ["~/Developer/projex"]
idiomatic_version_file_enable_tools = ["node", "bun"]

[tools]
go = "1.26.4"
node = { version = "lts", postinstall = "npm install -g typescript@5.9.3 @vue/typescript-plugin" }
python = "3.13"
ruff = "latest"
terraform = "latest"
wrangler = { version = "4.129.0", allow_builds = [
  "esbuild",
  "sharp",
  "workerd",
] }
"npm:typescript-language-server" = "latest"
"npm:vscode-langservers-extracted" = "latest"
"npm:@vue/language-server" = "latest"
